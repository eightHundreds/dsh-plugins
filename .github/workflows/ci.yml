name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:pack "$GITHUB_REPOSITORY" ci-check
      - run: pnpm test:release "$GITHUB_REPOSITORY" ci-check
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-tarballs
          path: artifacts/release/ci-check/*
          retention-days: 7
