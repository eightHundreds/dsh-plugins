name: Release attachments
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:pack "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
      - run: pnpm test:release "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
      - name: Create draft release and upload prebuilt attachments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file "artifacts/release/$GITHUB_REF_NAME/install.md"
          fi
          gh release upload "$GITHUB_REF_NAME" artifacts/release/"$GITHUB_REF_NAME"/*.tgz artifacts/release/"$GITHUB_REF_NAME"/SHA256SUMS artifacts/release/"$GITHUB_REF_NAME"/install.md --clobber
